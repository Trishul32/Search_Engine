# Generated by frontend/theme.py (glass). Run `python frontend/theme.py <name>` to change.
[theme]
base = "dark"
primaryColor = "#c084fc"
backgroundColor = "#0d0a1f"
secondaryBackgroundColor = "#1d1738"
textColor = "#efeafd"
linkColor = "#e9d5ff"
borderColor = "#2f2752"
baseRadius = "0.7rem"
buttonRadius = "full"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Space Grotesk:https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap"
showWidgetBorder = true
chartCategoricalColors = ["#67e8f9", "#c084fc", "#a3e635", "#f472b6", "#fbbf24"]

[theme.sidebar]
backgroundColor = "#110d27"
secondaryBackgroundColor = "#1d1738"

[server]
headless = true

[browser]
gatherUsageStats = false
